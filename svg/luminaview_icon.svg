<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="centerGlow" x1="0.5" y1="0.5" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)"/>

  <!-- 外圈光晕环 -->
  <circle cx="128" cy="110" r="76" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.3"/>

  <!-- 镜头/光圈主体 - 模拟相机镜头 -->
  <circle cx="128" cy="110" r="68" fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- 光圈叶片效果 - 六边形 -->
  <polygon points="128,56 162,76 162,124 128,144 94,124 94,76"
           fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.6"/>

  <!-- 光圈叶片效果 - 小六边形 -->
  <polygon points="128,68 155,84 155,118 128,134 101,118 101,84"
           fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.4"/>

  <!-- 中心菱形（对焦/取景概念） -->
  <rect x="104" y="86" width="48" height="48" rx="8" ry="8"
        fill="url(#centerGlow)" transform="rotate(45, 128, 110)"/>

  <!-- 中心小圆点 -->
  <circle cx="128" cy="110" r="6" fill="#121212"/>

  <!-- 顶部光线 - 左侧 -->
  <line x1="54" y1="52" x2="70" y2="68" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 顶部光线 - 中间 -->
  <line x1="128" y1="38" x2="128" y2="56" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- 顶部光线 - 右侧 -->
  <line x1="202" y1="52" x2="186" y2="68" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 底部光弧 -->
  <path d="M 88 178 Q 128 190 168 178" fill="none" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- 文字 "LV" 在底部 -->
  <text x="128" y="214" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="800" letter-spacing="4"
        fill="#ff9800" opacity="0.9">LV</text>
</svg>
